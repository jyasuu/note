ans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">index KV for sparse attention</text><text x="60" y="242" style="fill:rgb(15, 110, 86);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">ids from the block manager</text></g>
