ot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">compression rings (fp32)</text><text x="370" y="242" style="fill:rgb(83, 74, 183);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">consumer SWA, not persisted</text></g>
